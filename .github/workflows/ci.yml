name: CI

on:
    push:
      branches:
        - master
    schedule:
    - cron: "0 11 * * *"
    workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  # JOB 1: Test Packages
  # Triggers on: push OR workflow_dispatch
  test:
    name: Test Packages

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Chocolatey AU Action
        uses: chocolatey-community/chocolatey-au-action@2.0
        with:
          package-paths: automatic/*
          push: false
          test-install: true
          commit-changes: false

  # JOB 2: Update & Push Packages          
  # Triggers on: schedule OR manual workflow_dispatch (if test succeeded)
  update:
    name: Update & Push Packages
    needs: test

    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
      )

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Chocolatey AU Action
        uses: chocolatey-community/chocolatey-au-action@2.0
        with:
          package-paths: automatic/*
          push: true
          api-key: ${{ secrets.CHOCO_TOKEN }}
          test-install: true
          commit-changes: true
        
      - name: Update Production Gist with AU Report File
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: "4f822ef7bbf7188cd0b108ed8c6f7e84"
        run: |
          # 1. Look for the actual Markdown report generated by AU on disk
          $reportPaths = @(
              "Update-AUPackages.md",
              "reports/Update-AUPackages.md",
              "$env:TEMP/chocolatey/au/Update-AUPackages.md"
          )

          $reportFile = $reportPaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($reportFile) {
              Write-Host "Found AU report file at: $reportFile"
              $summaryContent = Get-Content -Path $reportFile -Raw
          } else {
              Write-Host "Report file not found, falling back to GITHUB_STEP_SUMMARY"
              $summaryContent = Get-Content -Path $env:GITHUB_STEP_SUMMARY -Raw -ErrorAction SilentlyContinue
          }

          if (-not $summaryContent) {
              $summaryContent = "No AU report available for this run."
          }

          # 2. Patch the Gist with the report content
          $payload = @{
              description = "Chocolatey AU Update Status - Last Run: $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')"
              files = @{
                  "Update-AUPackages.md" = @{
                      content = $summaryContent
                  }
              }
          } | ConvertTo-Json -Depth 5

          $headers = @{
              "Authorization"        = "Bearer $env:GH_TOKEN"
              "Accept"               = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          Invoke-RestMethod -Uri "https://api.github.com/gists/$env:GIST_ID" -Method Patch -Headers $headers -Body $payload
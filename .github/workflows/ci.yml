name: CI

on:
    push:
      branches:
        - master
    schedule:
    - cron: "0 11 * * *"
    workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  # JOB 1: Test Packages
  # Triggers on: push OR workflow_dispatch
  test:
    name: Test Packages

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Chocolatey AU Action
        uses: chocolatey-community/chocolatey-au-action@2.0
        with:
          package-paths: automatic/*
          push: false
          test-install: true
          commit-changes: false

  # JOB 2: Update & Push Packages          
  # Triggers on: schedule OR manual workflow_dispatch (if test succeeded)
  update:
    name: Update & Push Packages
    needs: test

    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
      )

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Chocolatey AU Action
        uses: chocolatey-community/chocolatey-au-action@2.0
        with:
          package-paths: automatic/*
          push: true
          api-key: ${{ secrets.CHOCO_TOKEN }}
          test-install: true
          commit-changes: true
        
      - name: Update Production Gist with AU Report File
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: "4f822ef7bbf7188cd0b108ed8c6f7e84"
        run: |
          # 1. Look for the actual Markdown report generated by AU on disk
          $reportPaths = @(
              "Update-AUPackages.md",
              "reports/Update-AUPackages.md",
              "$env:TEMP/chocolatey/au/Update-AUPackages.md"
          )

          $reportFile = $reportPaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($reportFile) {
              Write-Host "Found AU report file at: $reportFile"
              $summaryContent = Get-Content -Path $reportFile -Raw
          } else {
              Write-Host "Report file not found, falling back to GITHUB_STEP_SUMMARY"
              $summaryContent = Get-Content -Path $env:GITHUB_STEP_SUMMARY -Raw -ErrorAction SilentlyContinue
          }

          if (-not $summaryContent) {
              $summaryContent = "No AU report available for this run."
          }

          # 2. Patch the Gist with the report content
          $payload = @{
              description = "Chocolatey AU Update Status - Last Run: $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')"
              files = @{
                  "Update-AUPackages.md" = @{
                      content = $summaryContent
                  }
              }
          } | ConvertTo-Json -Depth 5

          $headers = @{
              "Authorization"        = "Bearer $env:GH_TOKEN"
              "Accept"               = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          Invoke-RestMethod -Uri "https://api.github.com/gists/$env:GIST_ID" -Method Patch -Headers $headers -Body $payload

      - name: Debug - Find and Dump All .MD Report Files
        # Runs even if the AU action fails or logs errors
        if: always() 
        
        run: |
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "1. CHECKING ENVIRONMENT VARIABLES" -ForegroundColor Cyan
          Write-Host "=================================================="
          Write-Host "GITHUB_STEP_SUMMARY path: $env:GITHUB_STEP_SUMMARY"
          if ($env:GITHUB_STEP_SUMMARY -and (Test-Path $env:GITHUB_STEP_SUMMARY)) {
              $summarySize = (Get-Item $env:GITHUB_STEP_SUMMARY).Length
              Write-Host "GITHUB_STEP_SUMMARY exists! File size: $summarySize bytes" -ForegroundColor Green
              Write-Host "--- SUMMARY FILE PREVIEW ---"
              Get-Content -Path $env:GITHUB_STEP_SUMMARY -Raw
              Write-Host "----------------------------"
          } else {
              Write-Host "GITHUB_STEP_SUMMARY file does not exist or is empty." -ForegroundColor Yellow
          }

          Write-Host "`n==================================================" -ForegroundColor Cyan
          Write-Host "2. SEARCHING FOR .MD FILES IN WORKSPACE ($env:GITHUB_WORKSPACE)" -ForegroundColor Cyan
          Write-Host "=================================================="
          $workspaceMd = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.md" -Recurse -ErrorAction SilentlyContinue
          if ($workspaceMd) {
              $workspaceMd | ForEach-Object {
                  Write-Host "FOUND: $($_.FullName) ($($_.Length) bytes)" -ForegroundColor Green
              }
          } else {
              Write-Host "No .md files found in workspace." -ForegroundColor Yellow
          }

          Write-Host "`n==================================================" -ForegroundColor Cyan
          Write-Host "3. SEARCHING FOR .MD FILES IN TEMP ($env:TEMP)" -ForegroundColor Cyan
          Write-Host "=================================================="
          $tempMd = Get-ChildItem -Path $env:TEMP -Filter "*.md" -Recurse -ErrorAction SilentlyContinue
          if ($tempMd) {
              $tempMd | ForEach-Object {
                  Write-Host "FOUND: $($_.FullName) ($($_.Length) bytes)" -ForegroundColor Green
                  Write-Host "--- CONTENT PREVIEW ($($_.Name)) ---"
                  Get-Content -Path $_.FullName -Raw | Select-Object -First 20
                  Write-Host "------------------------------------"
              }
          } else {
              Write-Host "No .md files found in $env:TEMP." -ForegroundColor Yellow
          }

          Write-Host "`n==================================================" -ForegroundColor Cyan
          Write-Host "4. LISTING CHOCOLATEY AU TEMP DIRECTORY CONTENTS" -ForegroundColor Cyan
          Write-Host "=================================================="
          $auTempPath = Join-Path $env:TEMP "chocolatey\au"
          if (Test-Path $auTempPath) {
              Get-ChildItem -Path $auTempPath -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
              Write-Host "Directory does not exist: $auTempPath" -ForegroundColor Yellow
          }
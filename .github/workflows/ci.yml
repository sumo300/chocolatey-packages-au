name: CI

on:
    push:
      branches:
        - master
    schedule:
    - cron: "0 11 * * *"
    workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  # JOB 1: Test Packages
  # Triggers on: push OR workflow_dispatch
  test:
    name: Test Packages

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Chocolatey AU Action
        uses: chocolatey-community/chocolatey-au-action@2.0
        with:
          package-paths: automatic/*
          push: false
          test-install: true
          commit-changes: false

  # JOB 2: Update & Push Packages          
  # Triggers on: schedule OR manual workflow_dispatch (if test succeeded)
  update:
    name: Update & Push Packages
    needs: test

    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
      )

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Chocolatey AU Action
        id: au
        uses: chocolatey-community/chocolatey-au-action@2.0
        with:
          package-paths: automatic/*
          push: true
          api-key: ${{ secrets.CHOCO_TOKEN }}
          test-install: true
          commit-changes: true
        
      - name: Update Production Gist from AU Results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: "4f822ef7bbf7188cd0b108ed8c6f7e84"
          AU_RESULTS_JSON: ${{ steps.au.outputs.results }}
        run: |
          # 1. Parse JSON results
          $results = $env:AU_RESULTS_JSON | ConvertFrom-Json

          # 2. Build Markdown Table
          $md = @()
          $md += "## Chocolatey AU Update Report"
          $md += "*Last Run: $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')"
          $md += ""
          $md += "| Package | Status | Version | Error / Details |"
          $md += "| :--- | :--- | :--- | :--- |"

          if ($results -and $results.Count -gt 0) {
              foreach ($r in $results) {
                  # Extract leaf folder name
                  $pkg = Split-Path -Leaf $r.Package
                  
                  $status = $r.Status
                  
                  # Format Version safely
                  $versionVal = if ($r.Version) { $r.Version } else { 'N/A' }
                  $versionFormatted = "``$versionVal``"
                  
                  $err = if ($r.Error) { $r.Error -replace '\r?\n', ' ' } else { 'None' }

                  # Format Status with Emojis
                  $statusFormatted = switch ($status) {
                      'Updated'  { "✅ Updated" }
                      'NoUpdate' { "➖ No Update" }
                      'Error'    { "❌ Error" }
                      default    { $status }
                  }

                  $md += "| **$pkg** | $statusFormatted | $versionFormatted | $err |"
              }
          } else {
              $md += "| *None* | *No packages evaluated* | - | - |"
          }

          $markdownContent = $md -join "`n"

          # 3. Patch Gist
          $payload = @{
              description = "Chocolatey AU Update Status - Last Run: $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')"
              files = @{
                  "Update-AUPackages.md" = @{
                      content = $markdownContent
                  }
              }
          } | ConvertTo-Json -Depth 5

          $headers = @{
              "Authorization"        = "Bearer $env:GH_TOKEN"
              "Accept"               = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          Invoke-RestMethod -Uri "https://api.github.com/gists/$env:GIST_ID" -Method Patch -Headers $headers -Body $payload